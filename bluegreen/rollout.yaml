apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: nginx-bluegreen
  namespace: bluegreen

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-bluegreen

  template:
    metadata:
      labels:
        app: nginx-bluegreen

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

  strategy:
    blueGreen:
      activeService: nginx-active
      previewService: nginx-preview
      autoPromotionEnabled: false
