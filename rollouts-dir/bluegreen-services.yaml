apiVersion: v1
kind: Service
metadata:
  name: nginx-active
  namespace: bluegreen
spec:
  selector:
    app: nginx-bluegreen
  ports:
    - port: 80
      targetPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-preview
  namespace: bluegreen
spec:
  selector:
    app: nginx-bluegreen
  ports:
    - port: 80
      targetPort: 80
